<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GameMall 数字游戏商城</title>
    <style>
        :root {
            --ink: #18212f;
            --muted: #6b7280;
            --line: #d9e1ea;
            --page: #eef2f6;
            --panel: #ffffff;
            --brand: #0f766e;
            --brand-dark: #115e59;
            --accent: #c2410c;
            --ok: #15803d;
            --bad: #b91c1c;
            --warn: #a16207;
            --shadow: 0 14px 34px rgba(17, 24, 39, .10);
        }

        * { box-sizing: border-box; }
        body {
            margin: 0;
            color: var(--ink);
            background: var(--page);
            font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        }
        button, input, select, textarea { font: inherit; }
        button {
            border: 0;
            border-radius: 8px;
            background: var(--brand);
            color: #fff;
            padding: 10px 14px;
            cursor: pointer;
            transition: transform .15s ease, background .15s ease;
        }
        button:hover { background: var(--brand-dark); transform: translateY(-1px); }
        button.secondary { background: #334155; }
        button.ghost { background: #e7edf3; color: var(--ink); }
        button.warn { background: var(--accent); }
        button.small { padding: 7px 10px; font-size: 13px; }
        button:disabled { opacity: .55; cursor: not-allowed; transform: none; }
        input, select, textarea {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 8px;
            padding: 10px 11px;
            background: #fff;
            color: var(--ink);
        }
        textarea { min-height: 86px; resize: vertical; }
        label { display: grid; gap: 6px; color: var(--muted); font-size: 13px; }
        .app-shell {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 240px minmax(0, 1fr);
        }
        .sidebar {
            background: #172033;
            color: #dce7f5;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
            gap: 22px;
            position: sticky;
            top: 0;
            height: 100vh;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 800;
            font-size: 22px;
        }
        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            background: #0f766e;
            color: #fff;
        }
        .nav { display: grid; gap: 8px; }
        .nav button {
            background: transparent;
            color: #dce7f5;
            text-align: left;
            padding: 11px 12px;
            border: 1px solid transparent;
        }
        .nav button.active, .nav button:hover {
            background: rgba(255,255,255,.10);
            border-color: rgba(255,255,255,.16);
            transform: none;
        }
        .session-box {
            margin-top: auto;
            border-top: 1px solid rgba(255,255,255,.14);
            padding-top: 16px;
            display: grid;
            gap: 10px;
            font-size: 13px;
            color: #b9c8d9;
        }
        .main {
            padding: 26px;
            display: grid;
            gap: 20px;
            align-content: start;
        }
        .topbar {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
        }
        .title h1 {
            margin: 0 0 6px;
            font-size: 28px;
            letter-spacing: 0;
        }
        .title p { margin: 0; color: var(--muted); }
        .status-strip {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }
        .metric, .panel, .game-card, .order-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 8px;
            box-shadow: var(--shadow);
        }
        .metric { padding: 14px; }
        .metric strong { display: block; font-size: 23px; margin-bottom: 3px; }
        .metric span { color: var(--muted); font-size: 13px; }
        .panel { padding: 18px; }
        .panel-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            margin-bottom: 14px;
        }
        .panel-head h2 { margin: 0; font-size: 18px; }
        .toolbar {
            display: grid;
            grid-template-columns: 1fr 180px auto;
            gap: 10px;
            align-items: end;
        }
        .view { display: none; }
        .view.active { display: grid; gap: 18px; }
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
        }
        .game-card {
            overflow: hidden;
            display: grid;
        }
        .cover {
            aspect-ratio: 16 / 9;
            background: #d7dee7;
            object-fit: cover;
            width: 100%;
            display: block;
        }
        .game-body {
            padding: 14px;
            display: grid;
            gap: 10px;
        }
        .game-title {
            font-weight: 800;
            font-size: 17px;
            min-height: 42px;
        }
        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            color: var(--muted);
            font-size: 13px;
        }
        .tag {
            display: inline-flex;
            align-items: center;
            min-height: 24px;
            border-radius: 6px;
            padding: 3px 8px;
            background: #eef5f4;
            color: #0f766e;
            font-size: 12px;
        }
        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .price {
            font-weight: 900;
            color: var(--accent);
            font-size: 20px;
        }
        .card-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .split {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 360px;
            gap: 16px;
        }
        .list { display: grid; gap: 10px; }
        .line-item {
            display: grid;
            grid-template-columns: 70px minmax(0, 1fr) auto;
            gap: 12px;
            align-items: center;
            padding: 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: #fff;
        }
        .line-item img {
            width: 70px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            background: #d7dee7;
        }
        .line-title { font-weight: 800; }
        .line-sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
        .qty-control {
            display: grid;
            grid-template-columns: 36px 48px 36px;
            gap: 5px;
            align-items: center;
        }
        .qty-control button { padding: 8px 0; }
        .qty-control input { text-align: center; padding: 8px 4px; }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        .form-grid .wide { grid-column: 1 / -1; }
        .orders { display: grid; gap: 12px; }
        .order-card { padding: 14px; display: grid; gap: 10px; }
        .order-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }
        .order-no { font-weight: 800; }
        .status {
            border-radius: 6px;
            padding: 4px 8px;
            background: #e8f3ee;
            color: var(--ok);
            font-size: 12px;
        }
        .status.pending { background: #fff7df; color: var(--warn); }
        .status.cancelled { background: #fae8e8; color: var(--bad); }
        .toast {
            position: fixed;
            right: 20px;
            bottom: 20px;
            max-width: 360px;
            background: #172033;
            color: #fff;
            border-radius: 8px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            display: none;
            z-index: 20;
        }
        .toast.show { display: block; }
        .empty {
            border: 1px dashed #b8c4d1;
            border-radius: 8px;
            padding: 26px;
            text-align: center;
            color: var(--muted);
            background: #f8fafc;
        }
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, .58);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 18px;
            z-index: 10;
        }
        .modal.show { display: flex; }
        .dialog {
            width: min(760px, 100%);
            max-height: 90vh;
            overflow: auto;
            background: #fff;
            border-radius: 8px;
            padding: 18px;
        }
        .dialog-head {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
            margin-bottom: 12px;
        }
        .dialog-head h2 { margin: 0; }
        .hidden { display: none !important; }

        @media (max-width: 920px) {
            .app-shell { grid-template-columns: 1fr; }
            .sidebar {
                position: static;
                height: auto;
                padding: 16px;
            }
            .nav { grid-template-columns: repeat(4, minmax(0, 1fr)); }
            .nav button { text-align: center; padding: 10px 6px; }
            .session-box { margin-top: 0; }
            .main { padding: 16px; }
            .status-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .toolbar, .split { grid-template-columns: 1fr; }
        }
        @media (max-width: 560px) {
            .topbar, .panel-head, .order-head { align-items: stretch; flex-direction: column; }
            .status-strip, .form-grid, .card-actions { grid-template-columns: 1fr; }
            .line-item { grid-template-columns: 58px minmax(0, 1fr); }
            .line-item > .qty-control, .line-item > .line-actions { grid-column: 1 / -1; }
        }
    </style>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><span class="brand-mark">GM</span><span>GameMall</span></div>
        <nav class="nav">
            <button class="active" data-view="store">商城</button>
            <button data-view="cart">购物车</button>
            <button data-view="orders">订单</button>
            <button data-view="admin">运营</button>
        </nav>
        <div class="session-box">
            <div id="sessionText">未登录</div>
            <button id="loginOpenBtn" class="secondary">登录 / 注册</button>
            <button id="logoutBtn" class="ghost hidden">退出登录</button>
            <a href="/swagger-ui.html" target="_blank" style="color:#9fd8d2;text-decoration:none;">Swagger 文档</a>
        </div>
    </aside>

    <main class="main">
        <section class="topbar">
            <div class="title">
                <h1>数字游戏交易工作台</h1>
                <p>浏览、加购、下单、支付、库存扣减与后台运营联动展示。</p>
            </div>
            <button id="refreshBtn" class="ghost">刷新数据</button>
        </section>

        <section class="status-strip">
            <div class="metric"><strong id="metricGames">0</strong><span>在线游戏</span></div>
            <div class="metric"><strong id="metricStock">0</strong><span>可售库存</span></div>
            <div class="metric"><strong id="metricCart">0</strong><span>购物车数量</span></div>
            <div class="metric"><strong id="metricOrders">0</strong><span>我的订单</span></div>
        </section>

        <section id="store" class="view active">
            <div class="panel">
                <div class="panel-head">
                    <h2>游戏展示与分类检索</h2>
                    <span class="tag" id="totalText">0 条结果</span>
                </div>
                <div class="toolbar">
                    <label>关键词
                        <input id="keywordInput" placeholder="搜索游戏名称">
                    </label>
                    <label>分类
                        <select id="categorySelect"></select>
                    </label>
                    <button id="searchBtn">查询</button>
                </div>
            </div>
            <div id="gamesGrid" class="games-grid"></div>
        </section>

        <section id="cart" class="view">
            <div class="split">
                <div class="panel">
                    <div class="panel-head">
                        <h2>购物车</h2>
                        <button id="loadCartBtn" class="ghost">重新加载</button>
                    </div>
                    <div id="cartList" class="list"></div>
                </div>
                <div class="panel">
                    <div class="panel-head"><h2>订单确认</h2></div>
                    <div class="metric" style="box-shadow:none;margin-bottom:12px;">
                        <strong id="cartTotal">¥0.00</strong>
                        <span>当前购物车合计</span>
                    </div>
                    <button id="checkoutBtn" style="width:100%;">创建待支付订单</button>
                </div>
            </div>
        </section>

        <section id="orders" class="view">
            <div class="panel">
                <div class="panel-head">
                    <h2>订单状态流转</h2>
                    <button id="loadOrdersBtn" class="ghost">重新加载</button>
                </div>
                <div id="ordersList" class="orders"></div>
            </div>
        </section>

        <section id="admin" class="view">
            <div class="split">
                <div class="panel">
                    <div class="panel-head"><h2>后台商品运营</h2></div>
                    <div id="adminGames" class="list"></div>
                </div>
                <div class="panel">
                    <div class="panel-head"><h2>新增 / 更新商品</h2></div>
                    <form id="gameForm" class="form-grid">
                        <input type="hidden" id="gameId">
                        <label>分类<select id="adminCategory"></select></label>
                        <label>游戏名称<input id="gameTitle" required></label>
                        <label>开发商<input id="developer"></label>
                        <label>发行商<input id="publisher"></label>
                        <label>价格<input id="price" type="number" min="0" step="0.01" required></label>
                        <label>库存<input id="stock" type="number" min="0" step="1" required></label>
                        <label class="wide">封面 URL<input id="coverUrl"></label>
                        <label class="wide">描述<textarea id="description"></textarea></label>
                        <button type="submit">保存商品</button>
                        <button type="button" id="resetGameForm" class="ghost">清空</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
</div>

<div id="authModal" class="modal">
    <div class="dialog">
        <div class="dialog-head">
            <h2>账号登录</h2>
            <button id="closeAuth" class="ghost small">关闭</button>
        </div>
        <form id="loginForm" class="form-grid">
            <label>用户名<input id="username" value="admin" autocomplete="username"></label>
            <label>密码<input id="password" type="password" value="admin123" autocomplete="current-password"></label>
            <button type="submit">登录</button>
            <button type="button" id="registerBtn" class="ghost">注册普通用户</button>
        </form>
    </div>
</div>

<div id="detailModal" class="modal">
    <div class="dialog">
        <div class="dialog-head">
            <h2 id="detailTitle">游戏详情</h2>
            <button id="closeDetail" class="ghost small">关闭</button>
        </div>
        <div id="detailBody"></div>
    </div>
</div>

<div id="toast" class="toast"></div>

<script>
const state = {
    token: localStorage.getItem("gm_token") || "",
    user: JSON.parse(localStorage.getItem("gm_user") || "null"),
    categories: [],
    games: [],
    cart: [],
    orders: []
};

const $ = (id) => document.getElementById(id);
const money = (n) => "¥" + Number(n || 0).toFixed(2);
const statusText = (s) => ({5:"创建中",10:"待支付",20:"已支付",30:"已取消",40:"已关闭"}[s] || "未知");
const statusClass = (s) => s === 10 ? "pending" : (s === 30 || s === 40 ? "cancelled" : "");

function toast(message) {
    const box = $("toast");
    box.textContent = message;
    box.classList.add("show");
    clearTimeout(window.__toastTimer);
    window.__toastTimer = setTimeout(() => box.classList.remove("show"), 2600);
}

async function api(path, options = {}) {
    const headers = {"Content-Type": "application/json", ...(options.headers || {})};
    if (state.token) headers.Authorization = "Bearer " + state.token;
    const res = await fetch(path, {...options, headers});
    const text = await res.text();
    const body = text ? JSON.parse(text) : {};
    if (!res.ok || body.code !== 0) {
        throw new Error(body.message || ("HTTP " + res.status));
    }
    return body.data;
}

function setView(id) {
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === id));
    document.querySelectorAll(".nav button").forEach(b => b.classList.toggle("active", b.dataset.view === id));
    if (id === "cart") loadCart();
    if (id === "orders") loadOrders();
    if (id === "admin") renderAdmin();
}

function updateSession() {
    if (state.user) {
        $("sessionText").textContent = `${state.user.username}（${state.user.role}）`;
        $("loginOpenBtn").classList.add("hidden");
        $("logoutBtn").classList.remove("hidden");
    } else {
        $("sessionText").textContent = "未登录";
        $("loginOpenBtn").classList.remove("hidden");
        $("logoutBtn").classList.add("hidden");
    }
}

function requireLogin() {
    if (!state.token) {
        $("authModal").classList.add("show");
        throw new Error("请先登录");
    }
}

async function loadCategories() {
    state.categories = await api("/api/categories");
    const options = ['<option value="">全部分类</option>']
        .concat(state.categories.map(c => `<option value="${c.id}">${c.name}</option>`)).join("");
    $("categorySelect").innerHTML = options;
    $("adminCategory").innerHTML = state.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join("");
}

async function loadGames() {
    const params = new URLSearchParams({page: "1", size: "50"});
    if ($("keywordInput").value.trim()) params.set("keyword", $("keywordInput").value.trim());
    if ($("categorySelect").value) params.set("categoryId", $("categorySelect").value);
    const data = await api("/api/games?" + params.toString());
    state.games = data.records || [];
    $("totalText").textContent = `${data.total || 0} 条结果`;
    renderGames();
    renderAdmin();
    updateMetrics();
}

function renderGames() {
    $("gamesGrid").innerHTML = state.games.length ? state.games.map(g => `
        <article class="game-card">
            <img class="cover" src="${g.coverUrl || "https://picsum.photos/seed/game/640/360"}" alt="${g.title}">
            <div class="game-body">
                <div class="game-title">${g.title}</div>
                <div class="meta"><span class="tag">${g.categoryName || "未分类"}</span><span>${g.developer || "独立工作室"}</span><span>销量 ${g.soldCount || 0}</span></div>
                <div class="price-row"><span class="price">${money(g.price)}</span><span>库存 ${g.stock}</span></div>
                <div class="card-actions">
                    <button class="ghost" onclick="openDetail(${g.id})">详情</button>
                    <button onclick="addCart(${g.id})" ${g.stock <= 0 ? "disabled" : ""}>加入购物车</button>
                </div>
            </div>
        </article>`).join("") : `<div class="empty">没有匹配的游戏</div>`;
}

async function openDetail(id) {
    try {
        const g = await api(`/api/games/${id}`);
        $("detailTitle").textContent = g.title;
        $("detailBody").innerHTML = `
            <img class="cover" src="${g.coverUrl || "https://picsum.photos/seed/detail/900/506"}" alt="${g.title}" style="border-radius:8px;margin-bottom:14px;">
            <div class="form-grid">
                <div><strong>${money(g.price)}</strong><div class="line-sub">价格</div></div>
                <div><strong>${g.stock}</strong><div class="line-sub">库存</div></div>
                <div><strong>${g.developer || "-"}</strong><div class="line-sub">开发商</div></div>
                <div><strong>${g.publisher || "-"}</strong><div class="line-sub">发行商</div></div>
                <p class="wide" style="line-height:1.7;margin:0;">${g.description || "暂无描述"}</p>
            </div>`;
        $("detailModal").classList.add("show");
    } catch (e) { toast(e.message); }
}

async function addCart(gameId) {
    try {
        requireLogin();
        await api("/api/cart", {method: "POST", body: JSON.stringify({gameId, quantity: 1})});
        toast("已加入购物车");
        await loadCart(false);
    } catch (e) { if (e.message !== "请先登录") toast(e.message); }
}

async function loadCart(show = true) {
    if (!state.token) {
        state.cart = [];
        renderCart();
        updateMetrics();
        return;
    }
    try {
        state.cart = await api("/api/cart");
        renderCart();
        updateMetrics();
        if (show) toast("购物车已更新");
    } catch (e) { toast(e.message); }
}

function renderCart() {
    const total = state.cart.reduce((sum, i) => sum + Number(i.subtotal || 0), 0);
    $("cartTotal").textContent = money(total);
    $("cartList").innerHTML = state.cart.length ? state.cart.map(i => `
        <div class="line-item">
            <img src="${i.coverUrl || "https://picsum.photos/seed/cart/160/90"}" alt="${i.title}">
            <div>
                <div class="line-title">${i.title}</div>
                <div class="line-sub">${money(i.price)} · 库存 ${i.stock} · 小计 ${money(i.subtotal)}</div>
            </div>
            <div class="qty-control">
                <button class="ghost small" onclick="changeQty(${i.gameId}, ${i.quantity - 1})">-</button>
                <input value="${i.quantity}" readonly>
                <button class="ghost small" onclick="changeQty(${i.gameId}, ${i.quantity + 1})">+</button>
            </div>
        </div>`).join("") : `<div class="empty">购物车为空</div>`;
}

async function changeQty(gameId, quantity) {
    try {
        requireLogin();
        if (quantity <= 0) await api(`/api/cart/${gameId}`, {method: "DELETE"});
        else await api(`/api/cart/${gameId}?quantity=${quantity}`, {method: "PUT"});
        await loadCart(false);
    } catch (e) { toast(e.message); }
}

async function checkout() {
    try {
        requireLogin();
        if (!state.cart.length) return toast("购物车为空");
        const idempotencyKey = "web-" + Date.now() + "-" + Math.random().toString(16).slice(2);
        const order = await api("/api/orders", {method: "POST", body: JSON.stringify({fromCart: true, idempotencyKey})});
        toast("订单已创建，库存已锁定");
        await Promise.all([loadCart(false), loadOrders(), loadGames()]);
        setView("orders");
        openOrderDetail(order.order.id);
    } catch (e) { toast(e.message); }
}

async function loadOrders() {
    if (!state.token) {
        state.orders = [];
        renderOrders();
        updateMetrics();
        return;
    }
    try {
        state.orders = await api("/api/orders?page=1&size=20");
        renderOrders();
        updateMetrics();
    } catch (e) { toast(e.message); }
}

function renderOrders() {
    $("ordersList").innerHTML = state.orders.length ? state.orders.map(o => `
        <article class="order-card">
            <div class="order-head">
                <div>
                    <div class="order-no">${o.orderNo}</div>
                    <div class="line-sub">创建时间 ${String(o.createdAt || "").replace("T", " ")} · 过期时间 ${String(o.expireAt || "").replace("T", " ")}</div>
                </div>
                <span class="status ${statusClass(o.status)}">${statusText(o.status)}</span>
            </div>
            <div class="price-row">
                <strong>${money(o.totalAmount)}</strong>
                <div>
                    <button class="ghost small" onclick="openOrderDetail(${o.id})">明细</button>
                    <button class="small" onclick="payOrder(${o.id})" ${o.status !== 10 ? "disabled" : ""}>模拟支付</button>
                    <button class="warn small" onclick="cancelOrder(${o.id})" ${o.status !== 10 ? "disabled" : ""}>取消</button>
                </div>
            </div>
        </article>`).join("") : `<div class="empty">暂无订单</div>`;
}

async function openOrderDetail(id) {
    try {
        const detail = await api(`/api/orders/${id}`);
        $("detailTitle").textContent = "订单明细";
        $("detailBody").innerHTML = `
            <div class="order-card" style="box-shadow:none;">
                <div class="order-head"><strong>${detail.order.orderNo}</strong><span class="status ${statusClass(detail.order.status)}">${statusText(detail.order.status)}</span></div>
                <div class="line-sub">订单金额 ${money(detail.order.totalAmount)}</div>
            </div>
            <div class="list" style="margin-top:12px;">
                ${detail.items.map(i => `<div class="line-item"><div></div><div><div class="line-title">${i.gameTitle}</div><div class="line-sub">${money(i.price)} × ${i.quantity}</div></div><strong>${money(i.subtotal)}</strong></div>`).join("")}
            </div>`;
        $("detailModal").classList.add("show");
    } catch (e) { toast(e.message); }
}

async function payOrder(id) {
    try {
        await api(`/api/orders/${id}/pay`, {method: "POST"});
        toast("支付成功，销量已更新");
        await Promise.all([loadOrders(), loadGames()]);
    } catch (e) { toast(e.message); }
}

async function cancelOrder(id) {
    try {
        await api(`/api/orders/${id}/cancel`, {method: "POST"});
        toast("订单已取消，库存已回滚");
        await Promise.all([loadOrders(), loadGames()]);
    } catch (e) { toast(e.message); }
}

function renderAdmin() {
    const isAdmin = state.user && state.user.role === "ADMIN";
    $("gameForm").querySelectorAll("input,select,textarea,button").forEach(el => el.disabled = !isAdmin);
    $("adminGames").innerHTML = isAdmin ? (state.games.length ? state.games.map(g => `
        <div class="line-item">
            <img src="${g.coverUrl || "https://picsum.photos/seed/admin/160/90"}" alt="${g.title}">
            <div>
                <div class="line-title">${g.title}</div>
                <div class="line-sub">${g.categoryName || ""} · ${money(g.price)} · 库存 ${g.stock}</div>
            </div>
            <div class="line-actions">
                <button class="ghost small" onclick="editGame(${g.id})">编辑</button>
                <button class="warn small" onclick="setGameStatus(${g.id}, 0)">下架</button>
            </div>
        </div>`).join("") : `<div class="empty">暂无商品</div>`) : `<div class="empty">请使用管理员账号登录：admin / admin123</div>`;
}

async function editGame(id) {
    try {
        const g = await api(`/api/games/${id}`);
        $("gameId").value = g.id;
        $("adminCategory").value = g.categoryId;
        $("gameTitle").value = g.title || "";
        $("developer").value = g.developer || "";
        $("publisher").value = g.publisher || "";
        $("price").value = g.price || 0;
        $("stock").value = g.stock || 0;
        $("coverUrl").value = g.coverUrl || "";
        $("description").value = g.description || "";
    } catch (e) { toast(e.message); }
}

async function saveGame(e) {
    e.preventDefault();
    try {
        requireLogin();
        const id = $("gameId").value;
        const payload = {
            categoryId: Number($("adminCategory").value),
            title: $("gameTitle").value.trim(),
            developer: $("developer").value.trim(),
            publisher: $("publisher").value.trim(),
            price: Number($("price").value),
            stock: Number($("stock").value),
            coverUrl: $("coverUrl").value.trim(),
            description: $("description").value.trim(),
            releaseDate: null
        };
        await api(id ? `/api/admin/games/${id}` : "/api/admin/games", {
            method: id ? "PUT" : "POST",
            body: JSON.stringify(payload)
        });
        resetGameForm();
        await loadGames();
        toast("商品已保存");
    } catch (e) { toast(e.message); }
}

async function setGameStatus(id, status) {
    try {
        await api(`/api/admin/games/${id}/status?status=${status}`, {method: "PATCH"});
        await loadGames();
        toast("商品状态已更新");
    } catch (e) { toast(e.message); }
}

function resetGameForm() {
    $("gameForm").reset();
    $("gameId").value = "";
}

function updateMetrics() {
    $("metricGames").textContent = state.games.length;
    $("metricStock").textContent = state.games.reduce((sum, g) => sum + Number(g.stock || 0), 0);
    $("metricCart").textContent = state.cart.reduce((sum, i) => sum + Number(i.quantity || 0), 0);
    $("metricOrders").textContent = state.orders.length;
}

async function login(e) {
    e.preventDefault();
    try {
        const data = await api("/api/auth/login", {
            method: "POST",
            body: JSON.stringify({username: $("username").value.trim(), password: $("password").value})
        });
        state.token = data.token;
        state.user = {userId: data.userId, username: data.username, role: data.role};
        localStorage.setItem("gm_token", state.token);
        localStorage.setItem("gm_user", JSON.stringify(state.user));
        $("authModal").classList.remove("show");
        updateSession();
        await Promise.all([loadCart(false), loadOrders()]);
        renderAdmin();
        toast("登录成功");
    } catch (e) { toast(e.message); }
}

async function register() {
    try {
        const suffix = Math.floor(Math.random() * 100000);
        const data = await api("/api/auth/register", {
            method: "POST",
            body: JSON.stringify({username: "user" + suffix, password: "123456"})
        });
        state.token = data.token;
        state.user = {userId: data.userId, username: data.username, role: data.role};
        localStorage.setItem("gm_token", state.token);
        localStorage.setItem("gm_user", JSON.stringify(state.user));
        $("authModal").classList.remove("show");
        updateSession();
        toast(`已注册并登录：${data.username} / 123456`);
    } catch (e) { toast(e.message); }
}

document.querySelectorAll(".nav button").forEach(btn => btn.addEventListener("click", () => setView(btn.dataset.view)));
$("refreshBtn").addEventListener("click", () => Promise.all([loadGames(), loadCart(false), loadOrders()]).then(() => toast("数据已刷新")));
$("searchBtn").addEventListener("click", loadGames);
$("keywordInput").addEventListener("keydown", e => { if (e.key === "Enter") loadGames(); });
$("loadCartBtn").addEventListener("click", () => loadCart(true));
$("checkoutBtn").addEventListener("click", checkout);
$("loadOrdersBtn").addEventListener("click", loadOrders);
$("loginOpenBtn").addEventListener("click", () => $("authModal").classList.add("show"));
$("closeAuth").addEventListener("click", () => $("authModal").classList.remove("show"));
$("closeDetail").addEventListener("click", () => $("detailModal").classList.remove("show"));
$("loginForm").addEventListener("submit", login);
$("registerBtn").addEventListener("click", register);
$("logoutBtn").addEventListener("click", () => {
    state.token = "";
    state.user = null;
    state.cart = [];
    state.orders = [];
    localStorage.removeItem("gm_token");
    localStorage.removeItem("gm_user");
    updateSession();
    renderCart();
    renderOrders();
    renderAdmin();
    updateMetrics();
    toast("已退出登录");
});
$("gameForm").addEventListener("submit", saveGame);
$("resetGameForm").addEventListener("click", resetGameForm);

window.addCart = addCart;
window.openDetail = openDetail;
window.changeQty = changeQty;
window.openOrderDetail = openOrderDetail;
window.payOrder = payOrder;
window.cancelOrder = cancelOrder;
window.editGame = editGame;
window.setGameStatus = setGameStatus;

(async function init() {
    try {
        updateSession();
        await loadCategories();
        await loadGames();
        await Promise.all([loadCart(false), loadOrders()]);
    } catch (e) {
        toast(e.message);
    }
})();
</script>
</body>
</html>
